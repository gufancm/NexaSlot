services:
  db:
    restart: always

  redis:
    restart: always

  adminer:
    restart: always

  backend:
    restart: always
    expose:
      - "8000"
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      FORWARDED_ALLOW_IPS: 172.31.250.10

  worker:
    restart: always

  nginx:
    restart: always
    build:
      context: ./deploy/nginx
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Variable not set}
      CERT_RELOAD_SECONDS: ${CERT_RELOAD_SECONDS:-3600}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/nexaslot-templates:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        ipv4_address: 172.31.250.10

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done

volumes:
  certbot-conf:
  certbot-www:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
